# Migration Check adapter -- PAR-76's cascade world (ops/ci/cascade.yml, migration_check.workload_from).
# The change under test is a pull request's migrations/0002_*.sql (one of ../changes/, opened by
# rehearse.sh); this file is the workload it is replayed under, and how the Check reaches the
# database. The four probes are the four UNRELATED services, one probe each, so the Check's
# per-probe table is the per-service table: none of them reads or writes the accounts the changes
# delete (1 and 15000). The traffic that does touch those accounts is the executor inside the
# world, which the Check does not drive: it runs in every fork, as it ran in the baseline.
label: "cascade: hard-delete an account through ON DELETE CASCADE, under the services' and the executor's traffic"
table: accounts
# Straight to Postgres, not through PgBouncer: the Check's own statements and samples must not
# queue behind the pool they are measuring.
db_exec: docker exec -i -e PGPASSWORD=cascade cascade-db psql -U cascade -d cascade -X
smoke: smoke
rps: 20
drain_probe: api_functions
probes:
  - name: api_functions
    url: http://127.0.0.1:${PORT}/functions
  - name: billing_invoices
    url: http://127.0.0.1:3${CI_KK}90/invoices
  - name: dashboard_runs
    url: http://127.0.0.1:3${CI_KK}70/runs
  - name: ingest_event
    method: POST
    url: http://127.0.0.1:3${CI_KK}60/events
    headers: {Content-Type: application/json}
    body: '{"name":"migration-check.probe"}'
explain:
  - name: dashboard_runs
    sql: SELECT id, status, started_at FROM function_runs WHERE account_id = 5000 ORDER BY started_at DESC LIMIT 20
notes:
  - "Workload: 4 probes, one per unrelated service (api, billing, dashboard, ingest), round-robin at 20 requests/s in all; each request picks an account from 2000-14000. Inside the world, the executor sends 150 function runs/s, open loop, to accounts in proportion to their size (account 1 about a quarter), each run on its own PgBouncer client connection with up to 5 tries."
  - "PgBouncer: transaction pooling, 20 server connections for everything, query_wait_timeout 20 s; Postgres max_connections 100. The Check samples Postgres, so its connection counts are server-side; PgBouncer's client queue is not among its numbers."
