# gitleaks configuration for this repository.
#
#   docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact -v
#
# This repository carries the Compose files each upstream project ships for local development, and
# those files carry that project's published default credentials. They are flagged by every scanner
# and they protect nothing: each belongs to a service bound to loopback inside a throwaway
# microVM, holding synthetic data, on a box that is rebuilt from a snapshot.
#
# Each allowlist entry below names what it permits and why. The rule is: a finding is allowlisted
# only when the value is published by its upstream project or is an upstream default. Anything
# minted for this box — OAuth tokens, the CI key, generated PostHog secrets — is gitignored and
# has never been committed; verified with a full-history scan before this repository was made
# public.

title = "paraglobe benchmarks"

[extend]
useDefault = true

[[rules]]
  id = "generic-api-key"
  description = "Generic API key"
  regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\|:|<=|=>|:|\?=)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;]|$)'''
  [rules.allowlist]
    description = "MinIO's own published example KMS key, verbatim from minio/minio docs/kms/IAM.md"
    regexes = ['''my-minio-key:OSMM\+vkKUTCvQs9YL/CVMIMt43HFhkUpqJxTmGl6rYw=''']

[allowlist]
  description = "Upstream default credentials in local-development Compose files"
  regexes = [
    # Mattermost's standard local-development database password, from its own
    # docker-compose.common.yml. The service listens on the Docker network only.
    '''mostest_password''',
    '''mmuser:mostest''',
    # PostHog's hobby-stack default, from its own docker-compose.hobby.yml. Host is `db`, a
    # Docker service name, unreachable from outside the compose network.
    '''postgres://posthog:posthog@db:5432''',
    # MinIO's documented example root credentials, alongside the KMS key above.
    '''minioaccesskey''',
    '''miniosecretkey''',
  ]
  paths = [
    # Example files exist to show the shape of a secret, not to hold one. The real values are
    # generated by make-env.sh and gitignored.
    '''benchmarks/posthog/compose/hobby\.env\.example''',
  ]
